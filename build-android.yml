name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bundle Quill & Supabase locally for 100% offline APK
        run: |
          mkdir -p www/vendor
          curl -fsSL "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" -o www/vendor/quill.snow.css
          curl -fsSL "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js" -o www/vendor/quill.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" -o www/vendor/supabase.js

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android app icons & splash screens
        run: npx --yes @capacitor/assets generate --android || true

      - name: Sync web assets & plugins to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attachment-logbook-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
