name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bundle Quill & Supabase locally for 100% offline APK
        run: |
          mkdir -p www/vendor
          curl -fsSL "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" -o www/vendor/quill.snow.css
          curl -fsSL "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js" -o www/vendor/quill.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" -o www/vendor/supabase.js

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add AndroidX Biometric dependency
        run: |
          if ! grep -q "androidx.biometric:biometric" android/app/build.gradle; then
            sed -i 's/dependencies {/dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"/' android/app/build.gradle
          fi

      - name: Enable native Android Save as PDF & BiometricPrompt bridges
        run: |
          cat << 'EOF' > android/app/src/main/java/com/logbook/attachment/MainActivity.java
          package com.logbook.attachment;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.concurrent.Executor;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void print(final String jobName) {
                              runOnUiThread(() -> {
                                  WebView webView = bridge.getWebView();
                                  PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (printManager != null && webView != null) {
                                      String safeName = (jobName != null && !jobName.trim().isEmpty())
                                              ? jobName.trim()
                                              : "Attachment Log Book";
                                      PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(safeName);
                                      PrintAttributes attrs = new PrintAttributes.Builder()
                                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                              .build();
                                      printManager.print(safeName, adapter, attrs);
                                  }
                              });
                          }
                      }, "AndroidPrint");

                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean isAvailable() {
                              BiometricManager bm = BiometricManager.from(MainActivity.this);
                              int auth = BiometricManager.Authenticators.BIOMETRIC_STRONG
                                      | BiometricManager.Authenticators.BIOMETRIC_WEAK
                                      | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
                              return bm.canAuthenticate(auth) == BiometricManager.BIOMETRIC_SUCCESS;
                          }

                          @JavascriptInterface
                          public void authenticate(final String title, final String subtitle) {
                              runOnUiThread(() -> {
                                  Executor executor = ContextCompat.getMainExecutor(MainActivity.this);
                                  BiometricPrompt prompt = new BiometricPrompt(MainActivity.this, executor,
                                          new BiometricPrompt.AuthenticationCallback() {
                                              @Override
                                              public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                                                  notifyBiometricJs(true, "");
                                              }

                                              @Override
                                              public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                                                  notifyBiometricJs(false, errString != null ? errString.toString() : "Authentication cancelled");
                                              }

                                              @Override
                                              public void onAuthenticationFailed() {
                                                  notifyBiometricJs(false, "Biometric not recognized");
                                              }
                                          });
                                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                                          .setTitle(title != null && !title.isEmpty() ? title : "Unlock Log Book")
                                          .setSubtitle(subtitle != null ? subtitle : "Verify with fingerprint or face")
                                          .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG
                                                  | BiometricManager.Authenticators.BIOMETRIC_WEAK
                                                  | BiometricManager.Authenticators.DEVICE_CREDENTIAL)
                                          .build();
                                  prompt.authenticate(info);
                              });
                          }
                      }, "AndroidBiometric");
                  }
              }

              private void notifyBiometricJs(final boolean success, final String message) {
                  runOnUiThread(() -> {
                      WebView webView = bridge != null ? bridge.getWebView() : null;
                      if (webView != null) {
                          String safeMsg = message == null ? "" : message.replace("\\", "\\\\").replace("'", "\\'");
                          webView.evaluateJavascript(
                                  "if(window.__onNativeBiometricResult){window.__onNativeBiometricResult(" + success + ",'" + safeMsg + "');}",
                                  null);
                      }
                  });
              }
          }
          EOF

      - name: Generate Android app icons & splash screens
        run: npx --yes @capacitor/assets generate --android || true

      - name: Sync web assets & plugins to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attachment-logbook-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
